<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>stairwall remote</title>
  <style>
    :root { --bg: #0d0f14; --panel: #171a22; --line: #262a36; --fg: #e6e8ee; --dim: #8a90a0; --accent: #6cf0c2; --warn: #ffb454; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; padding: 12px 16px 40px; display: flex; flex-direction: column; }
    /* While calibrating: calibration controls first, scenes and power hidden. */
    body.calibrating .hide-cal { display: none; }
    body.calibrating #secCal { order: -1; }
    .status { order: -2; }
    body.calibrating #secCal h2 { margin-top: 10px; }
    h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 22px 0 8px; }
    .status { color: var(--dim); font-size: 13px; min-height: 1.4em; }
    .status b { color: var(--accent); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 8px; font: inherit; touch-action: manipulation; }
    button:active { background: var(--line); }
    button.on { border-color: var(--accent); color: var(--accent); }
    button.warn { border-color: var(--warn); color: var(--warn); }
    label { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    label span { width: 84px; color: var(--dim); }
    label output { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 300px); margin: 6px auto; }
    .pad button { padding: 22px 0; font-size: 22px; user-select: none; -webkit-user-select: none; touch-action: none; }
    .pad .mid { display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px; text-align: center; }
    .row { display: flex; gap: 8px; margin: 8px 0; }
    .row > * { flex: 1; }
    #calib { display: none; }
    #calib.show { display: block; }
  </style>
</head>
<body>
  <div class="status" id="status">connecting…</div>

  <section id="secWall" class="hide-cal">
  <h2>Wall</h2>
  <div class="grid" id="walls"></div>
  </section>

  <section id="secScene" class="hide-cal">
  <h2>Scene</h2>
  <div class="grid" id="scenes"></div>
  <div class="row">
    <button data-cmd='{"type":"prev"}'>◂ Prev</button>
    <button data-cmd='{"type":"next"}'>Next ▸</button>
    <button id="blackout" data-cmd='{"type":"blackout"}'>Blackout</button>
  </div>
  <div class="row" id="frameRow">
    <label style="margin:0;flex:1"><span>Frame</span>
      <select id="frameSel" style="flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 8px;font:inherit"></select>
    </label>
  </div>
  <div class="row" id="spotRow">
    <button id="spotlight" data-cmd='{"type":"spotlight"}'>Spotlight</button>
  </div>
  <div id="partyBox">
    <div class="row">
      <label style="margin:0;flex:1"><span>Look</span><select id="partyLook" style="flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 8px;font:inherit"></select></label>
    </div>
    <div class="row">
      <label style="margin:0;flex:1"><span>Dancer</span><select id="partyDancer" style="flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 8px;font:inherit"></select></label>
    </div>
    <div class="row">
      <button id="bpmDown">−</button>
      <button id="partyTap" style="flex:3">Tap tempo</button>
      <button id="bpmUp">+</button>
    </div>
    <div class="row">
      <button id="partyAuto" data-cmd='{"type":"party","action":"auto"}'>Auto</button>
    </div>
  </div>
  </section>

  <section id="secLight">
  <h2>Light</h2>
  <label><span>Brightness</span><input type="range" id="brightness" min="0" max="1" step="0.01"><output id="brightnessV"></output></label>
  <label><span>Flatten</span><input type="range" id="flatten" min="0" max="1" step="0.01"><output id="flattenV"></output></label>

  <h2>Colour balance</h2>
  <label><span>Red</span><input type="range" id="gain0" min="0.3" max="1" step="0.01"><output id="gain0V"></output></label>
  <label><span>Green</span><input type="range" id="gain1" min="0.3" max="1" step="0.01"><output id="gain1V"></output></label>
  <label><span>Blue</span><input type="range" id="gain2" min="0.3" max="1" step="0.01"><output id="gain2V"></output></label>
  </section>

  <section id="secPower" class="hide-cal">
  <h2>Power</h2>
  <div class="row">
    <button data-power="sleep">Sleep</button>
    <button data-power="shutdown" class="warn">Shut down</button>
  </div>
  </section>

  <section id="secCal">
  <h2>Calibration</h2>
  <div class="row">
    <button id="calToggle" data-cmd='{"type":"calibrate"}'>Calibrate</button>
    <button id="pattern" data-cmd='{"type":"pattern"}'>Pattern</button>
  </div>
  <div class="row" id="autoRow">
    <button id="autocal">Auto-calibrate</button>
  </div>
  <div class="status" id="autoStatus"></div>
  <div id="calib">
    <div class="row">
      <button data-cmd='{"type":"select","dir":-1}'>◂ Point</button>
      <button id="sel" disabled>–</button>
      <button data-cmd='{"type":"select","dir":1}'>Point ▸</button>
    </div>
    <div class="pad">
      <span></span><button data-nudge="0,-1">▲</button><span></span>
      <button data-nudge="-1,0">◀</button><span class="mid">hold to<br>repeat</span><button data-nudge="1,0">▶</button>
      <span></span><button data-nudge="0,1">▼</button><span></span>
    </div>
    <div class="row" id="steps">
      <button data-step="0.25">0.25px</button><button data-step="1" class="on">1px</button><button data-step="10">10px</button>
    </div>
    <div class="row">
      <button data-cmd='{"type":"rotate"}'>Rotate 90° ⟳</button>
      <button data-cmd='{"type":"flip"}'>Flip ⇋</button>
    </div>
    <div class="row">
      <button data-cmd='{"type":"addPoint"}'>+ Edge pt</button>
      <button data-cmd='{"type":"deletePoint"}'>− Edge pt</button>
    </div>
    <div class="row">
      <button data-cmd='{"type":"feather","d":-0.5}'>Feather −</button>
      <button data-cmd='{"type":"feather","d":0.5}'>Feather +</button>
    </div>
    <div class="row">
      <button data-cmd='{"type":"inset","d":-0.5}'>Inset −</button>
      <button data-cmd='{"type":"inset","d":0.5}'>Inset +</button>
    </div>
    <div class="row" id="gapsRow">
      <button data-cmd='{"type":"gaps","d":-0.25}'>Gaps −</button>
      <button id="gapsV" disabled>gaps</button>
      <button data-cmd='{"type":"gaps","d":0.25}'>Gaps +</button>
    </div>
    <div id="paneBox">
      <div class="row">
        <button data-cmd='{"type":"pane","dir":-1}'>◂ Pane</button>
        <button id="paneV" disabled>pane</button>
        <button data-cmd='{"type":"pane","dir":1}'>Pane ▸</button>
      </div>
      <div class="row">
        <button data-cmd='{"type":"paneShift","dx":-0.25}'>◀</button>
        <button data-cmd='{"type":"paneShift","dy":-0.25}'>▲</button>
        <button data-cmd='{"type":"paneShift","dy":0.25}'>▼</button>
        <button data-cmd='{"type":"paneShift","dx":0.25}'>▶</button>
      </div>
      <div class="row">
        <button data-cmd='{"type":"paneScale","dy":-0.005}'>Shorter</button>
        <button data-cmd='{"type":"paneScale","dy":0.005}'>Taller</button>
        <button data-cmd='{"type":"paneScale","dx":-0.005}'>Narrower</button>
        <button data-cmd='{"type":"paneScale","dx":0.005}'>Wider</button>
      </div>
    </div>
    <div class="row"><button id="save" data-cmd='{"type":"save"}'>Save</button></div>
  </div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let state = {}, step = 1;

    const send = (cmd) => fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) });

    document.body.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.cmd) send(JSON.parse(b.dataset.cmd));
      if (b.dataset.power) {
        const what = b.dataset.power === 'sleep' ? 'Put the box to sleep?' : 'Shut the box down?';
        if (confirm(what)) {
          fetch('/api/power', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: b.dataset.power }) });
          $('status').textContent = b.dataset.power === 'sleep' ? 'going to sleep…' : 'shutting down…';
        }
      }
      if (b.dataset.scene) send({ type: 'scene', name: b.dataset.scene });
      if (b.dataset.wall && b.dataset.wall !== state.wall) {
        fetch('/api/wall', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: b.dataset.wall }) });
        $('status').textContent = 'switching to ' + b.dataset.wall + '…';
      }
      if (b.dataset.step) {
        step = Number(b.dataset.step);
        document.querySelectorAll('[data-step]').forEach((s) => s.classList.toggle('on', s === b));
      }
    });

    // D-pad: one step per tap; hold to keep moving.
    document.querySelectorAll('[data-nudge]').forEach((b) => {
      const [x, y] = b.dataset.nudge.split(',').map(Number);
      let wait = 0, rep = 0;
      const nudge = () => send({ type: 'nudge', dx: x * step, dy: y * step });
      const stop = () => { clearTimeout(wait); clearInterval(rep); };
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        b.setPointerCapture(e.pointerId);
        nudge();
        wait = setTimeout(() => { rep = setInterval(nudge, 90); }, 400);
      });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, stop);
    });

    for (const id of ['brightness', 'flatten']) {
      let t = 0;
      $(id).addEventListener('input', (e) => {
        $(id + 'V').textContent = Number(e.target.value).toFixed(2);
        clearTimeout(t);
        t = setTimeout(() => send({ type: id, v: Number(e.target.value) }), 40);
      });
    }

    // Auto-calibrate: the projector's camera finds the print (takes ~1 minute).
    $('autocal').addEventListener('click', async () => {
      if (!confirm('Auto-calibrate? The wall will show patterns for about a minute. Keep the room dim.')) return;
      const r = await fetch('/api/autocal-run', { method: 'POST' });
      if (!r.ok) $('autoStatus').textContent = (await r.json()).error || 'could not start';
    });

    // Party: look, dancer, and tempo. Tap along to the music: the beat lands on each tap,
    // and two or more taps set the tempo (timed here on the phone, so network lag doesn't
    // smear it).
    $('partyLook').addEventListener('change', (e) => send({ type: 'party', action: 'look', v: e.target.value }));
    $('partyDancer').addEventListener('change', (e) => send({ type: 'party', action: 'dancer', v: e.target.value }));
    let taps = [];
    $('partyTap').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const now = performance.now();
      if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
      taps.push(now); taps = taps.slice(-8);
      const cmd = { type: 'party', beat: true };
      if (taps.length >= 2) cmd.bpm = Math.round((60000 * (taps.length - 1)) / (now - taps[0]));
      send(cmd);
      $('partyTap').textContent = cmd.bpm ? `Tap · ${cmd.bpm} bpm` : 'Tap again…';
    });
    $('bpmDown').addEventListener('click', () => send({ type: 'party', bpm: (state.party?.bpm || 124) - 2 }));
    $('bpmUp').addEventListener('click', () => send({ type: 'party', bpm: (state.party?.bpm || 124) + 2 }));

    // Window frame: auto (scene default), none, or a named frame.
    $('frameSel').addEventListener('change', (e) => send({ type: 'frame', v: e.target.value }));

    // Colour balance: one slider per channel.
    [0, 1, 2].forEach((c) => {
      let t = 0;
      $('gain' + c).addEventListener('input', (e) => {
        $('gain' + c + 'V').textContent = Number(e.target.value).toFixed(2);
        clearTimeout(t);
        t = setTimeout(() => send({ type: 'gain', c, v: Number(e.target.value) }), 40);
      });
    });

    // Walls: fetched once, and again whenever the projector reports a different wall.
    let walls = [], wallsFor = null;
    async function loadWalls() {
      try { walls = (await (await fetch('/api/walls')).json()).walls; } catch { walls = []; }
      wallsFor = state.wall;
      renderWalls();
    }
    function renderWalls() {
      $('walls').innerHTML = walls.map((w) => `<button data-wall="${w.name}" class="${w.name === state.wall ? 'on' : ''}">${w.title}</button>`).join('');
      $('secWall').style.display = walls.length > 1 ? '' : 'none';
    }

    function render() {
      const s = state;
      if (s.wall !== wallsFor) loadWalls(); else renderWalls();
      $('status').innerHTML = s.scene ? `showing <b>${s.scene}</b>${s.calibrating ? ' · calibrating' : ''}` : 'waiting for projector page…';
      $('scenes').innerHTML = (s.scenes || []).map((n) => `<button data-scene="${n}" class="${n === s.scene ? 'on' : ''}">${n}</button>`).join('');
      $('blackout').classList.toggle('warn', !!s.blackout);
      $('spotRow').style.display = s.spotlight == null ? 'none' : '';
      $('frameRow').style.display = s.frames ? '' : 'none';
      $('autoRow').style.display = s.autocal ? '' : 'none';
      if (s.frames && document.activeElement !== $('frameSel')) {
        const opts = [['auto', 'Auto (scene default)'], ['none', 'None'], ...Object.entries(s.frames)];
        $('frameSel').innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
        $('frameSel').value = s.frame || 'auto';
      }
      $('partyBox').style.display = s.party ? '' : 'none';
      if (s.party) {
        const fill = (id, opts, v) => {
          if (document.activeElement === $(id)) return;
          $(id).innerHTML = Object.entries(opts).map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
          $(id).value = v || '';
        };
        fill('partyLook', s.party.looks, s.party.look);
        fill('partyDancer', s.party.dancers, s.party.dancer);
        $('partyAuto').classList.toggle('on', !!s.party.auto);
        $('partyAuto').textContent = s.party.auto ? 'Auto: changes every 16 bars' : 'Auto: off';
        if (!taps.length || performance.now() - taps[taps.length - 1] > 2000) $('partyTap').textContent = `Tap tempo · ${s.party.bpm} bpm`;
      }
      $('spotlight').classList.toggle('on', !!s.spotlight);
      $('spotlight').textContent = s.spotlight ? 'Spotlight: on' : 'Spotlight: off';
      $('calToggle').classList.toggle('on', !!s.calibrating);
      $('calToggle').textContent = s.calibrating ? 'Done' : 'Calibrate';
      $('pattern').textContent = 'Pattern: ' + (s.pattern || '–');
      $('calib').classList.toggle('show', !!s.calibrating);
      // Entering or leaving calibration rearranges the page: jump to the top.
      if (document.body.classList.contains('calibrating') !== !!s.calibrating) window.scrollTo(0, 0);
      document.body.classList.toggle('calibrating', !!s.calibrating);
      $('sel').textContent = s.handleName || (s.handles ? `${s.selected + 1} / ${s.handles}` : '–');
      $('save').classList.toggle('warn', !!s.dirty);
      $('save').textContent = s.dirty ? 'Save (unsaved changes)' : 'Saved';
      $('gapsRow').style.display = s.panels ? '' : 'none';
      $('gapsV').textContent = `gaps ${s.gapGrow >= 0 ? '+' : ''}${s.gapGrow ?? 0} cm`;
      $('paneBox').style.display = s.panels ? '' : 'none';
      if (s.panels) $('paneV').textContent = `pane ${s.selPanel + 1}: ${(s.paneShift || [0, 0]).map((v) => (v >= 0 ? '+' : '') + v).join(', ')} cm · ${(s.paneScale || [1, 1]).map((v) => Math.round(v * 1000) / 10 + '%').join('×')}`;
      (s.gain || [1, 1, 1]).forEach((v, c) => {
        if (document.activeElement !== $('gain' + c)) { $('gain' + c).value = v; $('gain' + c + 'V').textContent = Number(v).toFixed(2); }
      });
      for (const id of ['brightness', 'flatten']) {
        if (document.activeElement !== $(id) && s[id] != null) {
          $(id).value = s[id];
          $(id + 'V').textContent = Number(s[id]).toFixed(2);
        }
      }
    }

    const es = new EventSource('/api/events');
    es.addEventListener('state', (e) => { state = JSON.parse(e.data); render(); });
    es.addEventListener('autocal-status', (e) => {
      const s = JSON.parse(e.data);
      const label = { running: '⏳ ', done: '✅ ', failed: '⚠️ ' }[s.state] || '';
      $('autoStatus').textContent = label + s.line;
      $('autocal').disabled = s.state === 'running';
    });
    es.onerror = () => { $('status').textContent = 'reconnecting…'; };
    render();
  </script>
</body>
</html>
